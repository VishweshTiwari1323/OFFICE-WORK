{% extends 'base.html' %}
{% load static %}

{% block title %}Password Changed  PM Workspace{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 relative overflow-hidden" style="background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #e0e7ff 100%);">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-emerald-400/10 rounded-full blur-[120px] animate-mesh-1"></div>
        <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-indigo-400/10 rounded-full blur-[100px] animate-mesh-2"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-emerald-300/5 rounded-full blur-[150px] animate-mesh-3"></div>
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808008_1px,transparent_1px),linear-gradient(to_bottom,#80808008_1px,transparent_1px)] bg-[size:32px_32px] [mask-image:radial-gradient(ellipse_80%_60%_at_50%_0%,#000_40%,transparent_100%)]"></div>
    </div>

    <div class="relative w-full max-w-md">
        <div class="bg-white/80 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-emerald-500/10 border border-white/60 p-8 sm:p-10 text-center reveal">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-emerald-500 to-teal-600 text-white rounded-full shadow-lg shadow-emerald-500/30 mb-6">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Password Updated</h1>
            <p class="text-sm text-slate-500 mt-2 mb-8">Your password has been changed successfully. Keep it safe!</p>
            <a href="{% url 'dashboard' %}" class="inline-flex items-center space-x-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 px-8 rounded-2xl shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/40 transition-all duration-200 active:scale-[0.98]">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Go to Dashboard</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
